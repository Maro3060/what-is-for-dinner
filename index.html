<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's For Dinner</title>
    <link rel="shortcut icon" href="images/meal.png" type="image/x-icon" />
    <!-- ====================== fontawsome ====================== -->
    <link rel="stylesheet" href="css/all.min.css" />
    <!-- ====================== bootstrap====================== -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <!-- ====================== main css file ====================== -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ====================== start nav bar ====================== -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm py-3">
      <div class="container">
        <a class="navbar-brand" href="#">
          <div class="logo d-flex column-gap-3">
            <div
              class="logo-img rounded-circle d-flex justify-content-center align-items-center shadow-lg"
            >
              <i class="fa-solid fa-utensils text-white fs-5"></i>
            </div>
            <div class="logo-data d-flex flex-column">
              <h1 class="m-0 p-0">What's For Dinner</h1>
              <p class="m-0 p-0">Your daily meal inspiration</p>
            </div>
          </div>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <hr class="d-block d-md-block" />
          <ul
            class="navbar-nav ms-auto fs-5 d-flex align-items-xl-center align-items-lg-center align-items-md-start align-items-sm-start"
          >
            <li class="nav-item">
              <a
                class="nav-link active d-flex align-items-center column-gap-2"
                aria-current="page"
                href="#"
              >
                <i class="fa-solid fa-bookmark"></i>
                <span class="d-block d-xl-none d-lg-none d-md-block fs-5"
                  >Saved Recipes</span
                >
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link d-flex align-items-center column-gap-2"
                href="#"
              >
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span class="d-block d-md-block d-lg-none d-xl-none"
                  >Recent</span
                >
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link d-flex align-items-center column-gap-2"
                href="#"
              >
                <i class="fa-solid fa-gear"></i>
                <span class="d-block d-md-block d-lg-none d-xl-none"
                  >Settings</span
                >
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link d-flex align-items-center column-gap-2"
                href="#"
              >
                <div class="profile-img">
                  <img
                    src="images/avatar-4.jpg"
                    alt="profile photo"
                    class="img-fluid rounded-circle"
                  />
                </div>
                <span class="d-block d-md-block d-lg-none d-xl-none"
                  >Profile</span
                >
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- ====================== end nav bar ====================== -->
    <!-- ====================== start recipe section ====================== -->
    <section id="recipes">
      <div class="container">
        <div class="card my-5 overflow-hidden">
          <div class="row g-0">
            <div class="recipe-img col-md-5 overflow-hidden position-relative">
              <div
                class="rate position-absolute z-2 rounded-pill py-2 px-3 d-flex align-items-center justify-content-center column-gap-2"
              >
                <i class="fa-solid fa-star"></i>
                4.6
                <span>(289 reviews)</span>
              </div>
              <div
                class="recipe-details z-2 position-absolute bottom-0 start-0 end-0 mx-3 bg-white mb-3 d-flex justify-content-around column-gap-2 column-gap-lg-4 p-2 p-lg-4 rounded-4"
              >
                <div class="time d-flex flex-column row-gap-1 align-items-center fs-6">
                  <i class="fa-solid fa-clock"></i>
                  <span>Prep Time</span>
                  <span>20 min</span>
                </div>
                <div class="cook-time d-flex flex-column row-gap-1 align-items-center fs-6">
                  <i class="fa-solid fa-fire-burner"></i>
                  <span>Cook Time</span>
                  <span>30 min </span>
                </div>
                <div class="surving d-flex flex-column row-gap-1 align-items-center fs-6">
                  <i class="fa-solid fa-users"></i>
                  <span>Servings</span>
                  <span>4 people</span>
                </div>
              </div>
              <img
                src="images/photo-1585032226651-759b368d7246.jpeg"
                alt="recipe image"
                class="img-fluid w-100 h-100"
              />
            </div>
            <div class="col-md-7">
              <div class="card-body mx-3 my-4">
                <div
                  class="recipe-data d-flex justify-content-between align-items-center"
                >
                  <div class="card-head d-flex flex-column row-gap-2">
                    <div class="category d-flex column-gap-2">
                      <div
                        class="level px-3 rounded-5 d-flex align-items-center"
                      >
                        <span>Easy</span>
                      </div>
                      <div
                        class="type px-3 py-1 rounded-5 d-flex align-items-center"
                      >
                        <span>Asian</span>
                      </div>
                    </div>
                    <div class="recipe-name">
                      <h2>Vegetable Curry</h2>
                      <p>Hearty vegetarian curry with coconut milk</p>
                    </div>
                  </div>
                  <div class="recipe-fuctions d-flex fs-5 column-gap-3 me-4">
                    <div class="save p-3 rounded-4 d-flex align-items-center">
                      <i class="fa-solid fa-bookmark"></i>
                    </div>
                    <div class="share p-3 rounded-4 d-flex align-items-center">
                      <i class="fa-solid fa-share-nodes"></i>
                    </div>
                  </div>
                </div>
                <div class="info-tabs">
                  <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                    <li class="nav-item mx-2" role="presentation">
                      <button
                        class="nav-link active"
                        id="pills-home-tab"
                        data-bs-toggle="pill"
                        data-bs-target="#pills-home"
                        type="button"
                        role="tab"
                        aria-controls="pills-home"
                        aria-selected="true"
                      >
                        <i class="fa-solid fa-list-check"></i>
                        Ingredients
                      </button>
                    </li>
                    <li class="nav-item mx-3" role="presentation">
                      <button
                        class="nav-link"
                        id="pills-profile-tab"
                        data-bs-toggle="pill"
                        data-bs-target="#pills-profile"
                        type="button"
                        role="tab"
                        aria-controls="pills-profile"
                        aria-selected="false"
                      >
                        <i class="fa-solid fa-book-open"></i>
                        Instructions
                      </button>
                    </li>
                    <li class="nav-item mx-3" role="presentation">
                      <button
                        class="nav-link"
                        id="pills-contact-tab"
                        data-bs-toggle="pill"
                        data-bs-target="#pills-contact"
                        type="button"
                        role="tab"
                        aria-controls="pills-contact"
                        aria-selected="false"
                      >
                        <i class="fa-solid fa-chart-pie"></i>
                        Nutrition
                      </button>
                    </li>
                    <li class="nav-item mx-3" role="presentation">
                      <button
                        class="nav-link"
                        id="pills-contact-tab"
                        data-bs-toggle="pill"
                        data-bs-target="#pills-contact"
                        type="button"
                        role="tab"
                        aria-controls="pills-contact"
                        aria-selected="false"
                      >
                        <i class="fa-solid fa-lightbulb"></i>
                        Chef's Tips
                      </button>
                    </li>
                  </ul>
                  <hr />
                  <div class="tab-content" id="pills-tabContent">
                    <div
                      class="tab-pane show active"
                      id="pills-home"
                      role="tabpanel"
                      aria-labelledby="pills-home-tab"
                      tabindex="0"
                    >
                      ...
                    </div>
                    <div
                      class="tab-pane"
                      id="pills-profile"
                      role="tabpanel"
                      aria-labelledby="pills-profile-tab"
                      tabindex="0"
                    >
                      ...
                    </div>
                    <div
                      class="tab-pane"
                      id="pills-contact"
                      role="tabpanel"
                      aria-labelledby="pills-contact-tab"
                      tabindex="0"
                    >
                      ...
                    </div>
                    <div
                      class="tab-pane"
                      id="pills-disabled"
                      role="tabpanel"
                      aria-labelledby="pills-disabled-tab"
                      tabindex="0"
                    >
                      ...
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- ====================== end recipe section ====================== -->
    <!-- ====================== fontawsome ====================== -->
    <script src="js/all.min.js"></script>
    <!-- ====================== bootstrap====================== -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <!-- ====================== main css file ====================== -->
    <script src="js/index.js"></script>
  </body>
</html>
